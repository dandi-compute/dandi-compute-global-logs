# Keeps the persistent `monitor/latest` branch naming the newest `monitor/YYYY-MM-DD` day branch in
# its one file, LATEST (e.g. `monitor/2026-11-05`), so the newest squeue snapshot can be found even
# when today has no branch: just after midnight, or for as long as the monitor is down.
#
# It runs when a branch is created (a new day's branch starts from main, so it carries this
# workflow), every hour in case a creation went unnoticed, and on demand. Each run looks at all the
# day branches on GitHub rather than at the one just created, so a late push of an older day never
# moves the pointer back, and a run that finds the pointer current changes nothing.
name: Point monitor/latest at the newest day

on:
    create:
    schedule:
        - cron: "23 * * * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: monitor-latest
    cancel-in-progress: false

jobs:
    point:
        # Of the branches and tags created, only monitor/ branches can change the newest day.
        if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'monitor/'))
        runs-on: ubuntu-latest
        steps:
            - name: Point monitor/latest at the newest monitor day branch
              env:
                  REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
              run: |
                  set -euo pipefail
                  branches=$(git ls-remote --heads "$REMOTE" 'refs/heads/monitor/*' | cut -f2 | sed 's#^refs/heads/##')
                  newest=$(grep -E '^monitor/[0-9]{4}-[0-9]{2}-[0-9]{2}$' <<< "$branches" | sort | tail -n 1 || true)
                  if [ -z "$newest" ]; then
                      echo "No monitor/YYYY-MM-DD branch to point at."
                      exit 0
                  fi

                  git init -q pointer
                  cd pointer
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if grep -qx monitor/latest <<< "$branches"; then
                      git fetch -q --depth 1 "$REMOTE" refs/heads/monitor/latest
                      git checkout -q FETCH_HEAD
                      if [ "$(cat LATEST 2> /dev/null)" = "$newest" ]; then
                          echo "monitor/latest already names $newest."
                          exit 0
                      fi
                  fi
                  echo "$newest" > LATEST
                  git add LATEST
                  git commit -q -m "Point monitor/latest at $newest"
                  git push -q "$REMOTE" HEAD:refs/heads/monitor/latest
                  echo "monitor/latest now names $newest."
